x-elasticsearch: &elasticsearch
  image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTICSEARCH_VERSION:-9.5.0}
  environment: &cluster
    cluster.name: foundatio-repositories-ci
    discovery.seed_hosts: es1,es2
    cluster.initial_master_nodes: es1,es2
    xpack.security.enabled: "false"
    ingest.geoip.downloader.enabled: "false"
    action.destructive_requires_name: "false"
    ES_JAVA_OPTS: -Xms512m -Xmx512m -XX:ActiveProcessorCount=2
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:9200/_cluster/health?wait_for_nodes=2&wait_for_status=yellow&timeout=2s"]
    interval: 3s
    timeout: 4s
    retries: 40

services:
  es1:
    <<: *elasticsearch
    environment:
      <<: *cluster
      node.name: es1
    ports:
      - "127.0.0.1:9200:9200"
  es2:
    <<: *elasticsearch
    environment:
      <<: *cluster
      node.name: es2
