name: PR 307 isolated final audit
on:
  push:
    branches: [audit/pr-307-final-validation-20260922]
    paths: ['.github/workflows/build.yml']
concurrency:
  group: pr307-linux-release-rehearsal
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  MINVERVERSIONOVERRIDE: 8.0.2-audit.pr307.${{ github.run_id }}
  ELASTICSEARCH_URL: http://localhost:9200
jobs:
  matrix:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        elasticsearch: ['8.19.15', '9.5.0']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Prepare and build unpatched regression baseline
        run: |
          mkdir -p .audit/results
          git rev-parse HEAD origin/main | tee .audit/results/revisions.txt
          python .audit/pr307/run.py tests
          dotnet build Foundatio.Repositories.slnx -c Release | tee .audit/results/red-build.log
      - name: Prove regressions fail before the fix
        run: |
          set +e
          dotnet test --project tests/Foundatio.Repositories.Elasticsearch.Tests/Foundatio.Repositories.Elasticsearch.Tests.csproj -c Release --no-build --filter-method '*TaskResponse_*' '*ErrorLineage_*' 2>&1 | tee .audit/results/red.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          grep -Eq 'failed: [1-9][0-9]*' .audit/results/red.log
      - name: Apply and build the complete candidate
        run: |
          python .audit/pr307/run.py fix
          python .audit/pr307/docs.py
          git diff --check
          dotnet build Foundatio.Repositories.slnx -c Release | tee .audit/results/green-build.log
          dotnet test --project tests/Foundatio.Repositories.Elasticsearch.Tests/Foundatio.Repositories.Elasticsearch.Tests.csproj -c Release --no-build --filter-method '*TaskResponse_*' '*ErrorLineage_*' | tee .audit/results/green.log
      - name: Provision isolated Elasticsearch
        env:
          ES_VERSION: ${{ matrix.elasticsearch }}
        run: |
          sudo sysctl -w vm.max_map_count=1048576
          docker run -d --name pr307-es -p 127.0.0.1:9200:9200 -e discovery.type=single-node -e xpack.security.enabled=false -e "cluster.name=foundatio-pr307-audit-${GITHUB_RUN_ID}-${ES_VERSION}" -e 'ES_JAVA_OPTS=-Xms1g -Xmx1g' "docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION}"
          for attempt in $(seq 1 120); do
            if curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > .audit/results/health.json; then
              if python -c 'import json; assert not json.load(open(".audit/results/health.json"))["timed_out"]'; then break; fi
            fi
            sleep 2
          done
          curl -fsS http://localhost:9200/ > .audit/results/server.json
          python -c 'import json,os; d=json.load(open(".audit/results/server.json")); assert d["version"]["number"]==os.environ["ES_VERSION"]; assert d["cluster_name"].startswith("foundatio-pr307-audit-")'
      - name: Full solution tests
        run: dotnet test --solution Foundatio.Repositories.slnx -c Release --no-build | tee .audit/results/full.log
      - name: Verify all changed C# files
        run: |
          mapfile -t modified < <(git diff --name-only -- '*.cs')
          mapfile -t added < <(git ls-files --others --exclude-standard -- '*.cs')
          dotnet format whitespace Foundatio.Repositories.slnx --no-restore --verify-no-changes --include "${modified[@]}" "${added[@]}" --verbosity diagnostic 2>&1 | tee .audit/results/format.log
          git diff --check
          git diff --binary > .audit/results/candidate.patch
      - name: External packaged consumers
        if: matrix.elasticsearch == '9.5.0'
        run: bash .audit/pr307/consumer.sh
      - name: Record current related-branch conflicts
        if: matrix.elasticsearch == '9.5.0'
        run: |
          for branch in fix/reindex-data-loss-phase0 fix/id-tiebreaker-unmapped-id-305; do
            label=${branch##*/}
            git rev-parse "origin/$branch" > ".audit/results/related-$label.sha"
            set +e
            git merge-tree --write-tree --name-only 13f069f60af1b406ee4dafa4874c1793b5caafba "origin/$branch" > ".audit/results/merge-$label.txt"
            result=$?
            set -e
            test "$result" -le 1
          done
      - name: Capture server logs
        if: always()
        run: docker logs pr307-es > .audit/results/elasticsearch.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr307-audit-${{ matrix.elasticsearch }}
          path: .audit/results
          retention-days: 7
  chain:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build the complete candidate
        run: |
          mkdir -p .audit/results
          python .audit/pr307/run.py tests
          python .audit/pr307/run.py fix
          python .audit/pr307/docs.py
          dotnet build Foundatio.Repositories.slnx -c Release | tee .audit/results/chain-build.log
      - name: Persistent 7 to 8 to 9 chain and snapshot restores
        run: bash .audit/pr307/chain.sh
      - name: Capture chain logs
        if: always()
        run: docker logs pr307-chain > .audit/results/chain-final-server.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr307-persistent-chain
          path: .audit/results
          retention-days: 7
  stage:
    needs: [matrix, chain]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Stage clean commits only after every release-rehearsal gate passes
        run: |
          mkdir -p .audit/results
          python .audit/pr307/run.py tests
          python .audit/pr307/run.py fix
          python .audit/pr307/docs.py
          git diff --check
          sed "s|audit/pr-307-candidate-20260922|audit/pr-307-candidate-${GITHUB_RUN_ID}|g" .audit/pr307/stage.sh > "$RUNNER_TEMP/pr307-stage.sh"
          bash "$RUNNER_TEMP/pr307-stage.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr307-validated-candidate
          path: .audit/results
          retention-days: 7
