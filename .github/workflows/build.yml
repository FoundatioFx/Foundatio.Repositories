name: Build
on:
  push:
    branches:
      - main
      - master
      - '[0-9]+.x'
      - '[0-9]+.[0-9]+'
    tags:
      - 'v**'
  pull_request:

jobs:
  build:
    uses: FoundatioFx/Foundatio/.github/workflows/build-workflow.yml@main
    secrets: inherit
    with:
      new-test-runner: true
      minimum-major-minor: '8.0'
