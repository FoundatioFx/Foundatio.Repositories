name: Build
on: [push, pull_request]

jobs:
  build:
    uses: FoundatioFx/Foundatio/.github/workflows/build-workflow.yml@main
    secrets: inherit
    with:
      new-test-runner: true
      compose-command: docker compose -f tests/docker-compose.elasticsearch.yml up -d --wait --wait-timeout 180
      minimum-major-minor: '8.0'
