name: PR 307 regression proof and candidate staging
on:
  push:
    branches: [audit/pr-307-final-validation-20260922]
    paths: ['.github/workflows/pr307-fast.yml', '.audit/pr307/**']
concurrency:
  group: pr307-final-candidate-staging
  cancel-in-progress: true
permissions:
  contents: write
defaults:
  run:
    shell: bash
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PYTHONUTF8: '1'
  MINVERVERSIONOVERRIDE: 8.0.2-audit.pr307.${{ github.run_id }}
jobs:
  stage:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Add regressions and compile the unpatched source
        run: |
          mkdir -p .audit/results
          python .audit/pr307/run.py tests
          dotnet build Foundatio.Repositories.slnx -c Release | tee .audit/results/red-build.log
      - name: Prove the new cases fail without the fixes
        run: |
          set +e
          dotnet test --project tests/Foundatio.Repositories.Elasticsearch.Tests/Foundatio.Repositories.Elasticsearch.Tests.csproj -c Release --no-build --filter-method '*TaskResponse_*' '*ErrorLineage_*' 2>&1 | tee .audit/results/red.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          grep -Eq 'failed: [1-9][0-9]*' .audit/results/red.log
      - name: Apply fixes and documentation
        run: |
          python .audit/pr307/run.py fix
          python .audit/pr307/docs.py
          git diff --check
          dotnet build Foundatio.Repositories.slnx -c Release | tee .audit/results/green-build.log
          dotnet test --project tests/Foundatio.Repositories.Elasticsearch.Tests/Foundatio.Repositories.Elasticsearch.Tests.csproj -c Release --no-build --filter-method '*TaskResponse_*' '*ErrorLineage_*' | tee .audit/results/green.log
          dotnet test --project tests/Foundatio.Repositories.Tests/Foundatio.Repositories.Tests.csproj -c Release --no-build | tee .audit/results/core.log
      - name: Verify source formatting and preserve the candidate patch
        run: bash .audit/pr307/format.sh
      - name: Package and execute external consumers
        run: bash .audit/pr307/consumer.sh
      - name: Materialize clean logical commits on a candidate branch only
        run: bash .audit/pr307/stage.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr307-windows-regression-proof
          path: .audit/results
          retention-days: 7
