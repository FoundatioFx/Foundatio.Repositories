name: PR 314 final audit
on:
  push:
    branches: [audit/pr-314-final-20260922]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          path: audit-control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feature/strict-mget-item-errors
          fetch-depth: 0
          path: source
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Apply reviewed changes on current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 30f6ec4249aff665fd33e8e6ba7602d10d128566
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          python3 ../audit-control/.audit/pr314/apply.py
          git diff 30f6ec4249aff665fd33e8e6ba7602d10d128566 --stat
          git log -3 --oneline
      - name: Release build
        run: dotnet build Foundatio.Repositories.slnx --configuration Release
      - name: Repeat deterministic retry tests twenty times
        run: |
          set -euo pipefail
          for iteration in $(seq 1 20); do
            echo "Deterministic retry iteration $iteration"
            dotnet test --project tests/Foundatio.Repositories.Elasticsearch.Tests --configuration Release --no-build --filter-class '*DeleteByQueryRetryTests' --report-trx --results-directory "${{ github.workspace }}/audit-results/retry-$iteration"
          done
      - name: Verify tests reject broken accumulation and retry budgets
        run: |
          set -euo pipefail
          target=src/Foundatio.Repositories.Elasticsearch/Repositories/ElasticRepositoryBase.cs
          cp "$target" /tmp/pr314-original.cs
          trap 'cp /tmp/pr314-original.cs "$target"' EXIT
          for mutation in accumulation budget; do
            cp /tmp/pr314-original.cs "$target"
            MUTATION="$mutation" python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('src/Foundatio.Repositories.Elasticsearch/Repositories/ElasticRepositoryBase.cs')
          s = p.read_text(encoding='utf-8')
          old, new = ('totalDeleted += response.Deleted ?? 0;', 'totalDeleted = response.Deleted ?? 0;') if os.environ['MUTATION'] == 'accumulation' else ('int maxAttempts = options.GetRetryCount() + 1;', 'int maxAttempts = 1;')
          assert s.count(old) == 1
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
            dotnet build tests/Foundatio.Repositories.Elasticsearch.Tests --configuration Release --no-restore
            set +e
            dotnet test --project tests/Foundatio.Repositories.Elasticsearch.Tests --configuration Release --no-build --filter-class '*DeleteByQueryRetryTests' --report-trx --results-directory "${{ github.workspace }}/audit-results/mutation-$mutation"
            result=$?
            set -e
            test "$result" -eq 2
            echo "Verified $mutation mutant was detected."
          done
          cp /tmp/pr314-original.cs "$target"
          git diff --exit-code
          dotnet build Foundatio.Repositories.slnx --configuration Release --no-restore
      - name: Start Elasticsearch
        run: docker compose up -d --wait elasticsearch
      - name: Full solution tests
        run: dotnet test --solution Foundatio.Repositories.slnx --configuration Release --no-build --report-trx --results-directory '${{ github.workspace }}/audit-results/full'
      - name: Check changed C# formatting
        run: |
          dotnet format Foundatio.Repositories.slnx --verify-no-changes --no-restore --include tests/Foundatio.Repositories.Elasticsearch.Tests/DeleteByQueryRetryTests.cs tests/Foundatio.Repositories.Elasticsearch.Tests/RepositoryTests.cs
      - name: Build documentation
        working-directory: source/docs
        run: |
          npm ci
          npm run build
      - name: Verify package creation without publishing
        run: dotnet pack Foundatio.Repositories.slnx --configuration Release --no-build --no-restore --output '${{ github.workspace }}/audit-results/packages'
      - name: Publish validated candidate branch
        run: |
          set -euo pipefail
          git diff --exit-code
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          candidate="audit/pr-314-candidate-20260922-${{ github.run_number }}"
          git push origin "HEAD:refs/heads/$candidate"
          echo "Candidate: $candidate" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Validated commit: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Included main: $(git rev-parse origin/main)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr314-final-audit-results
          path: audit-results/
          retention-days: 7
      - name: Stop test services
        if: always()
        run: docker compose down
