name: PR 314 final audit
on:
  push:
    branches: [audit/pr-314-final-20260922]
permissions:
  contents: read
concurrency:
  group: pr314-final-audit-ubuntu2204
  cancel-in-progress: true
jobs:
  diagnostics:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: b92b5c8f0dc1d28e1827c4dde94be5ee5fa3ee21
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture precise documentation advisory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          cd docs
          npm ci --ignore-scripts --no-audit
          set +e
          npm audit --json > ../audit-results/npm-audit.json
          audit_exit=$?
          set -e
          test "$audit_exit" -le 1
          node -e 'const r=require("../audit-results/npm-audit.json");if(r.error)throw Error(JSON.stringify(r.error));console.log(JSON.stringify(r,null,2));'
      - name: Build solution for design-time diagnostics
        run: dotnet build Foundatio.Repositories.slnx --configuration Release
      - name: Capture formatter diagnostics without modifying source
        shell: bash
        run: |
          set -euo pipefail
          dotnet format Foundatio.Repositories.slnx --verify-no-changes --no-restore --verbosity diagnostic --include tests/Foundatio.Repositories.Elasticsearch.Tests/DeleteByQueryRetryTests.cs tests/Foundatio.Repositories.Elasticsearch.Tests/DeleteByQueryRetryIntegrationTests.cs tests/Foundatio.Repositories.Elasticsearch.Tests/MultiGetResponseValidationTests.cs tests/Foundatio.Repositories.Elasticsearch.Tests/RepositoryTests.cs src/Foundatio.Repositories.Elasticsearch/Extensions/ElasticIndexExtensions.cs src/Foundatio.Repositories.Elasticsearch/Repositories/ElasticReadOnlyRepositoryBase.cs src/Foundatio.Repositories.Elasticsearch/Options/ElasticCommandOptions.cs src/Foundatio.Repositories/Options/CacheOptions.cs tests/Foundatio.Repositories.Tests/CacheOptionsTests.cs tests/Foundatio.Repositories.Elasticsearch.Tests/MultiGetErrorTests.cs tests/Foundatio.Repositories.Elasticsearch.Tests/ReadOnlyRepositoryTests.cs 2>&1 | tee audit-results/format-diagnostic.txt
          git diff --exit-code
          git rev-parse HEAD > audit-results/source-revision.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr314-final-diagnostics
          path: audit-results/
          retention-days: 7
