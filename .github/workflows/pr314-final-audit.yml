name: PR 314 final audit
on:
  push:
    branches: [audit/pr-314-final-20260922]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v6
        with:
          path: audit-control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: feature/strict-mget-item-errors
          fetch-depth: 0
          path: source
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Apply reviewed changes on current main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 30f6ec4249aff665fd33e8e6ba7602d10d128566
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          python3 ../audit-control/.audit/pr314/apply.py
          git diff 30f6ec4249aff665fd33e8e6ba7602d10d128566 --stat
          git log -5 --oneline
      - name: Release build
        run: dotnet build Foundatio.Repositories.slnx --configuration Release
      - name: Repeat deterministic regression tests twenty times
        run: |
          set -euo pipefail
          for iteration in $(seq 1 20); do
            echo "Deterministic regression iteration $iteration"
            dotnet test --project tests/Foundatio.Repositories.Elasticsearch.Tests --configuration Release --no-build --filter-class '*DeleteByQueryRetryTests' '*MultiGetResponseValidationTests' --report-trx --results-directory "${{ github.workspace }}/audit-results/repeat-$iteration"
          done
      - name: Verify regression tests detect deliberate mutations
        run: python3 ../audit-control/.audit/pr314/verify-mutants.py
      - name: Start Elasticsearch
        run: docker compose up -d --wait elasticsearch
      - name: Full solution tests
        run: dotnet test --solution Foundatio.Repositories.slnx --configuration Release --no-build --report-trx --results-directory '${{ github.workspace }}/audit-results/full'
      - name: Check changed C# formatting
        run: |
          dotnet format Foundatio.Repositories.slnx --verify-no-changes --no-restore --include tests/Foundatio.Repositories.Elasticsearch.Tests/DeleteByQueryRetryTests.cs tests/Foundatio.Repositories.Elasticsearch.Tests/MultiGetResponseValidationTests.cs tests/Foundatio.Repositories.Elasticsearch.Tests/RepositoryTests.cs src/Foundatio.Repositories.Elasticsearch/Extensions/ElasticIndexExtensions.cs src/Foundatio.Repositories.Elasticsearch/Repositories/ElasticReadOnlyRepositoryBase.cs src/Foundatio.Repositories.Elasticsearch/Options/ElasticCommandOptions.cs
      - name: Build documentation
        working-directory: source/docs
        run: |
          npm ci
          npm run build
      - name: Verify package creation without publishing
        run: dotnet pack Foundatio.Repositories.slnx --configuration Release --no-build --no-restore --output '${{ github.workspace }}/audit-results/packages'
      - name: Publish validated candidate branch
        run: |
          set -euo pipefail
          git diff --exit-code
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          candidate="audit/pr-314-candidate-20260922-${{ github.run_number }}"
          git push origin "HEAD:refs/heads/$candidate"
          echo "Candidate: $candidate" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Validated commit: $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Included main: $(git rev-parse origin/main)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr314-final-audit-results
          path: audit-results/
          retention-days: 7
      - name: Stop test services
        if: always()
        run: docker compose down
