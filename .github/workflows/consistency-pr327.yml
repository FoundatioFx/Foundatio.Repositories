name: PR 327 consistency validation
on:
  push:
    branches: [audit/pr-307-final-validation-20260922]
    paths: [.audit/consistency/pr327*.py, .github/workflows/consistency-pr327.yml]
concurrency:
  group: pr327-consistency-validation
  cancel-in-progress: true
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: product
          ref: 091b2ba0a6c24806568c42897c1078f0b00dae5c
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build and validate reconciliation evidence
        working-directory: product
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          for script in pr327-evidence pr327-runtime pr327-tests pr327-integration pr327-followup; do python ../harness/.audit/consistency/$script.py .; done
          python ../harness/.audit/consistency/lease-guard.py . 327
          git add -N .
          git diff --check
          dotnet build Foundatio.Repositories.slnx -c Release | tee ../evidence/build.log
          dotnet test --project tests/Foundatio.Repositories.Elasticsearch.Tests/Foundatio.Repositories.Elasticsearch.Tests.csproj -c Release --no-build --filter-class '*ReindexConsistencyEvidenceTests' '*ReindexLeaseGuardTests' | tee ../evidence/unit.log
          dotnet test --project tests/Foundatio.Repositories.Tests/Foundatio.Repositories.Tests.csproj -c Release --no-build | tee ../evidence/core.log
      - name: Full solution on isolated Elasticsearch 8 and 9
        working-directory: product
        run: |
          set -euo pipefail
          sudo sysctl -w vm.max_map_count=1048576
          for version in 8.19.15 9.5.0; do
            export FOUNDATIO_TEST_CLUSTER="consistency-${{ github.run_id }}-$version"
            docker run -d --name consistency-es -p 127.0.0.1:9200:9200 -e "cluster.name=$FOUNDATIO_TEST_CLUSTER" -e discovery.type=single-node -e xpack.security.enabled=false -e ingest.geoip.downloader.enabled=false -e ES_JAVA_OPTS='-Xms1g -Xmx1g' docker.elastic.co/elasticsearch/elasticsearch:$version
            for n in $(seq 1 90); do curl -fsS http://localhost:9200 > /dev/null && break; sleep 2; done
            curl -fsS http://localhost:9200
            dotnet test --solution Foundatio.Repositories.slnx -c Release --no-build | tee ../evidence/full-$version.log
            docker logs consistency-es > ../evidence/server-$version.log 2>&1
            docker rm -f consistency-es
          done
      - name: Verify formatting and stage clean product commits
        working-directory: product
        run: |
          set -euo pipefail
          mapfile -t paths < <(git diff --name-only -- '*.cs')
          dotnet format whitespace . --folder --include "${paths[@]}" --verbosity diagnostic > ../evidence/format-apply.log 2>&1
          dotnet format whitespace . --folder --verify-no-changes --include "${paths[@]}" --verbosity diagnostic > ../evidence/format-verify.log 2>&1
          git diff --check
          git config user.name 'Blake Niemyjski'
          git config user.email 'bniemyjski@gmail.com'
          git add src tests
          git commit -m 'fix: require complete routed reconciliation and retain retired source fences'
          git add docs .agents
          if ! git diff --cached --quiet; then git commit -m 'docs: specify reindex consistency and manual recovery boundaries'; fi
          test -z "$(git status --porcelain)"
          git diff --exit-code 091b2ba0a6c24806568c42897c1078f0b00dae5c HEAD -- .github
          test -z "$(git ls-tree -r --name-only HEAD -- .audit)"
          git push origin HEAD:refs/heads/audit/pr327-consistency-candidate-${{ github.run_id }}
          git log -2 --format='%H %s' | tee ../evidence/commits.txt
          git diff --binary 091b2ba0a6c24806568c42897c1078f0b00dae5c HEAD > ../evidence/candidate.patch
          git bundle create ../evidence/candidate.bundle HEAD
      - name: Capture diagnostics
        if: always()
        working-directory: product
        run: |
          mkdir -p ../evidence
          docker logs consistency-es > ../evidence/server-final.log 2>&1 || true
          git add -N .
          git diff --binary > ../evidence/working.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr327-consistency-evidence
          path: evidence
          retention-days: 7
