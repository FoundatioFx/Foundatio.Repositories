name: PR 327 isolated audit
on:
  push:
    branches: [audit/pr-327-hardening-20260922]
    paths: [.github/workflows/pr-327-audit.yml, .audit-327/**]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact reviewed source and history
        run: |
          git bundle create /tmp/pr-327-source.bundle HEAD refs/remotes/origin/main refs/remotes/origin/fix/reindex-data-loss-phase0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-327-source
          path: /tmp/pr-327-source.bundle
          retention-days: 2
          if-no-files-found: error
