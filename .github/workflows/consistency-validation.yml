name: Consistency hardening validation
on:
  push:
    branches: [audit/pr-307-final-validation-20260922]
    paths: [.audit/consistency/**, .github/workflows/consistency-validation.yml]
concurrency:
  group: consistency-hardening
  cancel-in-progress: false
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
jobs:
  lease:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: FoundatioFx/Foundatio
          ref: 394a97fa61418e88b4f94d20cf91410ca4bd011a
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Prove lost ownership was not reported
        working-directory: product
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          python ../harness/.audit/consistency/upstream.py . tests
          dotnet build Foundatio.slnx -c Release > ../evidence/red-build.log 2>&1
          set +e
          dotnet test --project tests/Foundatio.Tests/Foundatio.Tests.csproj -c Release --no-build --filter-class '*CacheLockRenewalTests' > ../evidence/red.log 2>&1
          result=$?
          set -e
          cat ../evidence/red.log
          test "$result" -eq 2
          grep -Eq 'failed: 3' ../evidence/red.log
      - name: Validate repair and existing lock suite
        working-directory: product
        run: |
          set -euo pipefail
          python ../harness/.audit/consistency/upstream.py . fix
          dotnet build Foundatio.slnx -c Release | tee ../evidence/green-build.log
          dotnet test --project tests/Foundatio.Tests/Foundatio.Tests.csproj -c Release --no-build --filter-class '*CacheLockRenewalTests' '*InMemoryLockTests' | tee ../evidence/green.log
          dotnet format whitespace . --folder --verify-no-changes --include src/Foundatio/Lock/CacheLockProvider.cs tests/Foundatio.Tests/Locks/CacheLockRenewalTests.cs --verbosity diagnostic > ../evidence/format.log 2>&1
          git add -N tests/Foundatio.Tests/Locks/CacheLockRenewalTests.cs
          git diff --check
          git diff --binary > ../evidence/upstream.patch
          tar -czf ../evidence/upstream-source.tar.gz src/Foundatio/Lock/CacheLockProvider.cs tests/Foundatio.Tests/Locks/CacheLockRenewalTests.cs docs/guide/locks.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lease-hardening-evidence
          path: evidence
          retention-days: 7
