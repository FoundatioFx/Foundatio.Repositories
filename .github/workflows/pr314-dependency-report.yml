name: PR 314 build preflight
on:
  push:
    branches: [audit/pr314-docs-advisory-20260922]
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 561ff3b26d76221e76891976434444518ace51fa
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Verify the baseline fails and all repaired settings pass
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results/baseline
          cp build/VerifySourceReferences.proj audit-results/baseline/
          git show 7febad724997cecc1e8e49624e67779d86ec1f94:build/common.props > audit-results/baseline/common.props
          set +e
          dotnet msbuild audit-results/baseline/VerifySourceReferences.proj -target:Verify -verbosity:minimal > audit-results/baseline-failure.txt 2>&1
          baseline_exit=$?
          set -e
          test "$baseline_exit" -ne 0
          grep -F "Unexpected source-reference settings for Standalone" audit-results/baseline-failure.txt
          dotnet msbuild build/VerifySourceReferences.proj -target:Verify -verbosity:minimal | tee audit-results/source-reference-tests.txt
          test "$(grep -c 'Passed source-reference scenario:' audit-results/source-reference-tests.txt)" -eq 12
      - name: Verify standalone provider compilation
        shell: bash
        run: |
          set -euo pipefail
          dotnet build src/Foundatio.Repositories.Elasticsearch/Foundatio.Repositories.Elasticsearch.csproj --configuration Release | tee audit-results/standalone-build.txt
          git diff --exit-code
          git rev-parse HEAD > audit-results/source-revision.txt
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr314-source-reference-preflight
          path: audit-results/
          retention-days: 7
