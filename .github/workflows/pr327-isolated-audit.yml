name: PR 327 isolated audit
on:
  push:
    branches: [audit/pr327-final-20260922]
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        artifact: [pr327-offline-toolchain, pr327-elasticsearch-8.19.0, pr327-elasticsearch-9.5.0]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: 35766291673
          github-token: ${{ github.token }}
          path: incoming
      - name: Split public validation dependencies into bounded artifacts
        run: |
          set -euo pipefail
          mkdir -p chunks
          tar -cf - -C incoming . | split --bytes=450M --numeric-suffixes=0 - chunks/part-
          sha256sum chunks/part-* > chunks/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-part-00
          path: chunks/part-00
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-part-01
          path: chunks/part-01
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-part-02
          path: chunks/part-02
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-checksums
          path: chunks/SHA256SUMS
          retention-days: 3
