name: PR 327 isolated audit
on:
  push:
    branches: [audit/pr327-final-20260922]
permissions:
  contents: read
  actions: read
concurrency:
  group: pr327-isolated-transfer
  cancel-in-progress: true
jobs:
  transfer:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        artifact: [pr327-offline-toolchain, pr327-elasticsearch-8.19.0, pr327-elasticsearch-9.5.0]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: 35766291673
          github-token: ${{ github.token }}
          path: incoming
      - name: Split public validation dependencies into bounded artifacts
        shell: python
        run: |
          import hashlib, pathlib, tarfile
          root = pathlib.Path('chunks')
          root.mkdir()
          with tarfile.open('transfer.tar', 'w') as archive:
              for path in sorted(pathlib.Path('incoming').iterdir()):
                  archive.add(path, arcname=path.name)
          checksums = []
          with open('transfer.tar', 'rb') as source:
              part = 0
              while data := source.read(450 * 1024 * 1024):
                  name = f'part-{part:02}'
                  (root / name).write_bytes(data)
                  checksums.append(f'{hashlib.sha256(data).hexdigest()}  {name}')
                  part += 1
          (root / 'SHA256SUMS').write_text('\n'.join(checksums) + '\n')
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-part-00
          path: chunks/part-00
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-part-01
          path: chunks/part-01
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-part-02
          path: chunks/part-02
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-checksums
          path: chunks/SHA256SUMS
          retention-days: 3
