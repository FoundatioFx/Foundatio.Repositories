name: PR327 isolated audit
on:
  push:
    branches: [audit/pr327-verification]
permissions:
  contents: read
concurrency:
  group: pr327-isolated-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        elasticsearch: ['8.19.0', '9.5.0']
    steps:
      - uses: actions/checkout@v6
        with:
          path: payload
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 091b2ba0a6c24806568c42897c1078f0b00dae5c
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Apply hash-verified review edits
        working-directory: source
        shell: bash
        run: |
          python ../payload/audit/apply.py
          git add src tests docs .agents
          git diff --cached --check
          git diff --cached --binary > ../reviewed.patch
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build release
        working-directory: source
        shell: bash
        run: dotnet build Foundatio.Repositories.slnx -c Release 2>&1 | tee ../build.log
      - name: Build documentation
        if: matrix.elasticsearch == '8.19.0'
        working-directory: source/docs
        shell: bash
        run: |
          npm ci
          npm run build 2>&1 | tee ../../docs-build.log
      - name: Start disposable Elasticsearch
        env:
          ES_VERSION: ${{ matrix.elasticsearch }}
        shell: bash
        run: |
          docker run -d --name pr327-elasticsearch -p 127.0.0.1:9200:9200 -e discovery.type=single-node -e xpack.security.enabled=false -e cluster.name=pr327-disposable -e ES_JAVA_OPTS='-Xms512m -Xmx512m' docker.elastic.co/elasticsearch/elasticsearch:$ES_VERSION
          for attempt in $(seq 1 90); do
            if curl --fail --silent 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > cluster.json; then exit 0; fi
            sleep 1
          done
          docker logs pr327-elasticsearch
          exit 1
      - name: Run complete test suite
        working-directory: source
        shell: bash
        run: dotnet test --solution Foundatio.Repositories.slnx --configuration Release --no-build --report-github 2>&1 | tee ../tests.log
      - name: Capture service logs
        if: always()
        run: docker logs pr327-elasticsearch > elasticsearch.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr327-evidence-${{ matrix.elasticsearch }}
          path: |
            reviewed.patch
            build.log
            docs-build.log
            tests.log
            cluster.json
            elasticsearch.log
          retention-days: 7
  prepare-commits:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          path: payload
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 091b2ba0a6c24806568c42897c1078f0b00dae5c
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare unreferenced reviewed commits
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python ../payload/audit/apply.py
          python ../payload/audit/prepare-commits.py
      - uses: actions/upload-artifact@v4
        with:
          name: pr327-commits
          path: |
            commits.json
            reviewed.patch
          retention-days: 7
