name: PR 308 isolated audit
on:
  push:
    branches: [audit/pr-308-20260922]
    paths: [.github/workflows/pr-308-audit.yml]
concurrency:
  group: pr-308-isolated-audit
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9ed59304eec0a092a58c617c8370e62eab1c5935
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Prove regressions, apply fixes, verify formatting and packaged consumers
        run: bash tools/.audit/prepare.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr308-candidate-source
          path: evidence
          retention-days: 3
          if-no-files-found: error
  integration:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        elasticsearch: ['8.19.15', '9.5.0']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELASTICSEARCH_VERSION: ${{ matrix.elasticsearch }}
      ELASTICSEARCH_URL: http://127.0.0.1:9200
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr308-candidate-source
          path: source
      - run: git clone source/candidate.bundle repo
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build the exact candidate and start isolated Elasticsearch
        working-directory: repo
        run: |
          test "$(git rev-parse HEAD)" = "$(cat ../source/candidate-sha.txt)"
          mkdir -p ../results
          dotnet build Foundatio.Repositories.slnx --configuration Release -warnaserror 2>&1 | tee ../results/build.log
          docker compose up -d --wait --wait-timeout 180 elasticsearch
          curl --fail --silent http://127.0.0.1:9200/ | tee ../results/server.json
      - name: Run every core and Elasticsearch test
        working-directory: repo
        run: |
          dotnet tests/Foundatio.Repositories.Tests/bin/Release/net10.0/Foundatio.Repositories.Tests.dll -result-xml ../results/core.xml 2>&1 | tee ../results/core.log
          dotnet tests/Foundatio.Repositories.Elasticsearch.Tests/bin/Release/net10.0/Foundatio.Repositories.Elasticsearch.Tests.dll -result-xml ../results/elasticsearch.xml 2>&1 | tee ../results/elasticsearch.log
          python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          assert json.loads(pathlib.Path('../results/server.json').read_text())['version']['number'] == os.environ['ELASTICSEARCH_VERSION']
          for name in ('core', 'elasticsearch'):
              tests = ET.parse(f'../results/{name}.xml').findall('.//test')
              assert len(tests) >= (152 if name == 'core' else 957), (name, len(tests))
              assert all(t.get('result') == 'Pass' for t in tests), [(t.get('name'), t.get('result')) for t in tests if t.get('result') != 'Pass']
              print(f'{name}: {len(tests)} passed, zero failures/skips')
          PY
      - name: Capture diagnostics and stop isolated services
        if: always()
        working-directory: repo
        run: |
          mkdir -p ../results
          docker compose logs --no-color elasticsearch > ../results/server.log
          docker compose down -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr308-tests-${{ matrix.elasticsearch }}
          path: results
          retention-days: 3
  documentation:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr308-candidate-source
          path: source
      - run: git clone source/candidate.bundle repo
      - name: Build documentation site
        working-directory: repo/docs
        run: |
          mkdir -p ../../docs-results
          node --version | tee ../../docs-results/node.txt
          npm ci 2>&1 | tee ../../docs-results/install.log
          npm run build 2>&1 | tee ../../docs-results/build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr308-docs
          path: docs-results
          retention-days: 3
  stage-candidate:
    needs: [prepare, integration, documentation]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9ed59304eec0a092a58c617c8370e62eab1c5935
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr308-candidate-source
          path: evidence
      - name: Stage validated commits without modifying the PR branch
        run: |
          git fetch evidence/candidate.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$(cat evidence/candidate-sha.txt)"
          git merge-base --is-ancestor 9ed59304eec0a092a58c617c8370e62eab1c5935 FETCH_HEAD
          git diff --exit-code 9ed59304eec0a092a58c617c8370e62eab1c5935 FETCH_HEAD -- .github
          git push origin "FETCH_HEAD:refs/heads/audit/pr-308-candidate-${{ github.run_id }}"
