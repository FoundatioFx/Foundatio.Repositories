name: PR 308 isolated audit
on:
  push:
    branches: [audit/pr-308-20260922]
    paths: [.github/workflows/pr-308-audit.yml]
concurrency:
  group: pr-308-isolated-audit
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9ed59304eec0a092a58c617c8370e62eab1c5935
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Apply verified live fixes and scalar regression tests
        working-directory: repo
        run: |
          mkdir -p ../evidence
          git config user.name 'Blake Niemyjski'
          git config user.email 'bniemyjski@gmail.com'
          python - <<'PY'
          import base64, hashlib, pathlib, re, subprocess, zlib
          workflow = subprocess.check_output(['git', 'show', '05c1a46e67f7d8b8d0e828cf45f0c4a5d94295f8:.github/workflows/pr-308-audit.yml'], text=True)
          payload = re.search(r"payload = '([A-Za-z0-9+/=]+)'", workflow).group(1)
          patches = [(payload, '9ef0f6469d59fdaedee7a8d9ebea97847160aea07ed302250a94143344e3de38')]
          for name, checksum in [('live-fix', '9a750e73d97361750c68b38e6d27759ddc7a9de1d7b74686c128eae3f0951d6a'), ('scalar-tests', '42faa3a11decb219420c51dfeb1e6fbdea0fc32ed4539ad1c5169b660e1f4498')]:
              patches.append((pathlib.Path(f'../tools/.audit/{name}.b64').read_text().strip(), checksum))
          for payload, checksum in patches:
              patch = zlib.decompress(base64.b64decode(payload, validate=True))
              assert hashlib.sha256(patch).hexdigest() == checksum
              subprocess.run(['git', 'am', '--committer-date-is-author-date'], input=patch, check=True)
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == '71e47fcae9b6808e0b9f559703de9e74227cfdf1'
          PY
          dotnet build Foundatio.Repositories.slnx --configuration Release -warnaserror 2>&1 | tee ../evidence/baseline-build.log
      - name: Prove scalar gaps without hiding unrelated failures
        working-directory: repo
        run: |
          set +e
          dotnet tests/Foundatio.Repositories.Elasticsearch.Tests/bin/Release/net10.0/Foundatio.Repositories.Elasticsearch.Tests.dll -class Foundatio.Repositories.Elasticsearch.Tests.SearchAfterRequestTests -result-xml ../evidence/scalar-baseline.xml 2>&1 | tee ../evidence/scalar-baseline.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -eq 1
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tests = ET.parse('../evidence/scalar-baseline.xml').findall('.//test')
          failed = [t for t in tests if t.get('result') == 'Fail']
          expected = ('ScalarQuery_WithIncompleteLiveCursorSearch', 'ScalarQuery_WithIncompatibleLivePaging', 'ScalarQuery_WithCompleteLiveCursorSearch')
          assert len(tests) == 136, len(tests)
          assert len(failed) == 36, [(t.get('name'), t.get('result')) for t in tests]
          assert all(any(name in t.get('name', '') for name in expected) for t in failed)
          assert all(t.get('result') in ('Pass', 'Fail') for t in tests)
          print('Confirmed 36 expected scalar failures; 100 existing/live tests passed.')
          PY
      - name: Complete scalar safety and documentation in logical commits
        working-directory: repo
        run: |
          python ../tools/.audit/finish.py scalar
          git diff --check
          git add src/Foundatio.Repositories.Elasticsearch/Repositories/ElasticReadOnlyRepositoryBase.cs
          git commit -m 'fix: enforce complete responses and compatible modes for scalar cursors'
          python ../tools/.audit/finish.py docs
          git diff --check
          git add src docs .agents
          git commit -m 'docs: clarify cursor session identity, scalar safety, and traversal ownership'
          test -z "$(git status --porcelain)"
          git diff --exit-code 9ed59304eec0a092a58c617c8370e62eab1c5935 HEAD -- .github
          git log -5 --format=fuller > ../evidence/commits.txt
          git diff --stat 9ed59304eec0a092a58c617c8370e62eab1c5935 > ../evidence/diffstat.txt
      - name: Build, run request regressions, and verify formatting
        working-directory: repo
        run: |
          dotnet build Foundatio.Repositories.slnx --configuration Release -warnaserror 2>&1 | tee ../evidence/final-build.log
          dotnet tests/Foundatio.Repositories.Elasticsearch.Tests/bin/Release/net10.0/Foundatio.Repositories.Elasticsearch.Tests.dll -class Foundatio.Repositories.Elasticsearch.Tests.SearchAfterRequestTests -result-xml ../evidence/request-tests.xml 2>&1 | tee ../evidence/request-tests.log
          mapfile -t changed < <(git diff --name-only 9ed59304eec0a092a58c617c8370e62eab1c5935 HEAD -- '*.cs')
          dotnet format Foundatio.Repositories.slnx --no-restore --verify-no-changes --include "${changed[@]}" 2>&1 | tee ../evidence/format.log
          git diff --check
          git bundle create ../evidence/candidate.bundle HEAD
          git rev-parse HEAD > ../evidence/candidate-sha.txt
          git format-patch --stdout 9ed59304eec0a092a58c617c8370e62eab1c5935..HEAD > ../evidence/fixes.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr308-candidate-source
          path: evidence
          retention-days: 3
          if-no-files-found: error
  integration:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        elasticsearch: ['8.19.15', '9.5.0']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELASTICSEARCH_VERSION: ${{ matrix.elasticsearch }}
      ELASTICSEARCH_URL: http://127.0.0.1:9200
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr308-candidate-source
          path: source
      - run: git clone source/candidate.bundle repo
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build the exact candidate and start isolated Elasticsearch
        working-directory: repo
        run: |
          test "$(git rev-parse HEAD)" = "$(cat ../source/candidate-sha.txt)"
          mkdir -p ../results
          dotnet build Foundatio.Repositories.slnx --configuration Release -warnaserror 2>&1 | tee ../results/build.log
          docker compose up -d --wait --wait-timeout 180 elasticsearch
          curl --fail --silent http://127.0.0.1:9200/ | tee ../results/server.json
      - name: Run every core and Elasticsearch test
        working-directory: repo
        run: |
          dotnet tests/Foundatio.Repositories.Tests/bin/Release/net10.0/Foundatio.Repositories.Tests.dll -result-xml ../results/core.xml 2>&1 | tee ../results/core.log
          dotnet tests/Foundatio.Repositories.Elasticsearch.Tests/bin/Release/net10.0/Foundatio.Repositories.Elasticsearch.Tests.dll -result-xml ../results/elasticsearch.xml 2>&1 | tee ../results/elasticsearch.log
          python - <<'PY'
          import json, os, pathlib, xml.etree.ElementTree as ET
          assert json.loads(pathlib.Path('../results/server.json').read_text())['version']['number'] == os.environ['ELASTICSEARCH_VERSION']
          for name in ('core', 'elasticsearch'):
              tests = ET.parse(f'../results/{name}.xml').findall('.//test')
              assert len(tests) >= (152 if name == 'core' else 949), (name, len(tests))
              assert all(t.get('result') == 'Pass' for t in tests), [(t.get('name'), t.get('result')) for t in tests if t.get('result') != 'Pass']
              print(f'{name}: {len(tests)} passed, zero failures/skips')
          PY
      - name: Capture diagnostics and stop isolated services
        if: always()
        working-directory: repo
        run: |
          mkdir -p ../results
          docker compose logs --no-color elasticsearch > ../results/server.log
          docker compose down -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr308-tests-${{ matrix.elasticsearch }}
          path: results
          retention-days: 3
  documentation:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr308-candidate-source
          path: source
      - run: git clone source/candidate.bundle repo
      - name: Build documentation site
        working-directory: repo/docs
        run: |
          mkdir -p ../../docs-results
          node --version | tee ../../docs-results/node.txt
          npm ci 2>&1 | tee ../../docs-results/install.log
          npm run build 2>&1 | tee ../../docs-results/build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr308-docs
          path: docs-results
          retention-days: 3
  stage-candidate:
    needs: [prepare, integration, documentation]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9ed59304eec0a092a58c617c8370e62eab1c5935
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr308-candidate-source
          path: evidence
      - name: Stage validated commits without modifying the PR branch
        run: |
          git fetch evidence/candidate.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$(cat evidence/candidate-sha.txt)"
          git merge-base --is-ancestor 9ed59304eec0a092a58c617c8370e62eab1c5935 FETCH_HEAD
          git diff --exit-code 9ed59304eec0a092a58c617c8370e62eab1c5935 FETCH_HEAD -- .github
          git push origin "FETCH_HEAD:refs/heads/audit/pr-308-candidate-${{ github.run_id }}"
