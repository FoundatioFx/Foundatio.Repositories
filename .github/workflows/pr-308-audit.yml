name: PR 308 isolated audit
on:
  push:
    branches: [audit/pr-308-20260922]
    paths: [.github/workflows/pr-308-audit.yml]
concurrency:
  group: pr-308-isolated-audit
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check patch integrity
        run: |
          mkdir -p /tmp/pr308-transport
          python - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          expected = {'live-fix': '9a750e73d97361750c68b38e6d27759ddc7a9de1d7b74686c128eae3f0951d6a', 'scalar-tests': '42faa3a11decb219420c51dfeb1e6fbdea0fc32ed4539ad1c5169b660e1f4498', 'scalar-fix': 'd52f1e3422ef75d21743e78317a0769c4a3296cc50db33b317d6f7eb548a8a8e', 'docs': 'b3f6614ee58aba496265d18cfaf1aaa0d1eafcdec2a70e78b9037d7e309c58fb'}
          result = {}
          for name, checksum in expected.items():
              payload = pathlib.Path(f'.audit/{name}.b64').read_text().strip()
              pathlib.Path(f'/tmp/pr308-transport/{name}.b64').write_text(payload)
              try:
                  patch = zlib.decompress(base64.b64decode(payload, validate=True))
                  actual = hashlib.sha256(patch).hexdigest()
                  result[name] = {'valid': actual == checksum, 'sha256': actual}
              except Exception as error:
                  result[name] = {'valid': False, 'error': str(error)}
          pathlib.Path('/tmp/pr308-transport/verification.json').write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          assert all(item['valid'] for item in result.values())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr-308-transport
          path: /tmp/pr308-transport
          retention-days: 3
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9ed59304eec0a092a58c617c8370e62eab1c5935
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Apply verified regression tests
        run: |
          mkdir -p /tmp/pr308-validation
          git config user.name 'Blake Niemyjski'
          git config user.email 'bniemyjski@gmail.com'
          python - <<'PY'
          import base64, hashlib, re, subprocess, zlib
          workflow = subprocess.check_output(['git', 'show', '05c1a46e67f7d8b8d0e828cf45f0c4a5d94295f8:.github/workflows/pr-308-audit.yml'], text=True)
          payload = re.search(r"payload = '([A-Za-z0-9+/=]+)'", workflow).group(1)
          patch = zlib.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '9ef0f6469d59fdaedee7a8d9ebea97847160aea07ed302250a94143344e3de38'
          subprocess.run(['git', 'am', '--committer-date-is-author-date'], input=patch, check=True)
          PY
      - name: Build with warnings as errors
        run: dotnet build Foundatio.Repositories.slnx --configuration Release -warnaserror
      - name: Prove the regressions fail for the expected reason
        run: |
          set +e
          dotnet tests/Foundatio.Repositories.Elasticsearch.Tests/bin/Release/net10.0/Foundatio.Repositories.Elasticsearch.Tests.dll -class Foundatio.Repositories.Elasticsearch.Tests.SearchAfterRequestTests -result-xml /tmp/pr308-validation/baseline.xml 2>&1 | tee /tmp/pr308-validation/baseline.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > /tmp/pr308-validation/exit-code.txt
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tests = ET.parse('/tmp/pr308-validation/baseline.xml').findall('.//test')
          failed = [t for t in tests if t.get('result') == 'Fail']
          expected = ('WhenLiveSessionIsReset', 'WhenBeforeQueryResetsLiveSession', 'WhenAfterQueryResetsLiveSession')
          assert len(failed) == 16, [(t.get('name'), t.get('result')) for t in tests]
          assert all(any(name in t.get('name', '') for name in expected) for t in failed)
          assert all('No exception was thrown' in ''.join(t.itertext()) for t in failed)
          assert all(t.get('result') in ('Pass', 'Fail') for t in tests)
          print(f'Confirmed {len(failed)} expected failures and {len(tests)-len(failed)} passing tests.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr-308-baseline-proven
          path: /tmp/pr308-validation
          retention-days: 3
