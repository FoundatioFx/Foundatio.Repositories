name: PR 308 isolated audit
on:
  push:
    branches: [audit/pr-308-20260922]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9ed59304eec0a092a58c617c8370e62eab1c5935
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Apply checksum-verified regression tests
        run: |
          mkdir -p /tmp/pr308-validation
          git config user.name 'Blake Niemyjski'
          git config user.email 'bniemyjski@gmail.com'
          python - <<'PY'
          import base64, hashlib, re, subprocess, zlib
          workflow = subprocess.check_output(['git', 'show', '05c1a46e67f7d8b8d0e828cf45f0c4a5d94295f8:.github/workflows/pr-308-audit.yml'], text=True)
          payload = re.search(r"payload = '([A-Za-z0-9+/=]+)'", workflow).group(1)
          patch = zlib.decompress(base64.b64decode(payload, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '9ef0f6469d59fdaedee7a8d9ebea97847160aea07ed302250a94143344e3de38'
          subprocess.run(['git', 'am', '--committer-date-is-author-date'], input=patch, check=True)
          PY
      - name: Build with warnings as errors
        run: dotnet build Foundatio.Repositories.slnx --configuration Release -warnaserror
      - name: Run regression probes
        run: |
          assembly=tests/Foundatio.Repositories.Elasticsearch.Tests/bin/Release/net10.0/Foundatio.Repositories.Elasticsearch.Tests.dll
          dotnet "$assembly" --help > /tmp/pr308-validation/help.txt
          set +e
          dotnet "$assembly" --filter-class Foundatio.Repositories.Elasticsearch.Tests.SearchAfterRequestTests 2>&1 | tee /tmp/pr308-validation/baseline.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > /tmp/pr308-validation/exit-code.txt
          test "$status" -eq 2
      - name: Preserve evidence
        if: always()
        run: |
          mkdir -p /tmp/pr308-validation
          git bundle create /tmp/pr308-validation/source.bundle HEAD
          git log -1 --format=fuller > /tmp/pr308-validation/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr-308-baseline-native
          path: /tmp/pr308-validation
          retention-days: 3
          if-no-files-found: error
