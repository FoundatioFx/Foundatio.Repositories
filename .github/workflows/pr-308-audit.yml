name: PR 308 isolated audit
on:
  push:
    branches: [audit/pr-308-20260922]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9ed59304eec0a092a58c617c8370e62eab1c5935
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Apply exact reviewed regression-test patch
        run: |
          test "$(git rev-parse HEAD)" = 9ed59304eec0a092a58c617c8370e62eab1c5935
          git config user.name 'Blake Niemyjski'
          git config user.email 'bniemyjski@gmail.com'
          mkdir -p /tmp/pr308-validation/baseline
          python - <<'ENDPY'
          import base64, hashlib, pathlib, subprocess, zlib
          payload = ''
          patch = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == '9ef0f6469d59fdaedee7a8d9ebea97847160aea07ed302250a94143344e3de38'
          pathlib.Path('/tmp/pr308-validation/tests.patch').write_bytes(patch)
          subprocess.run(['git', 'am'], input=patch, check=True)
          ENDPY
      - name: Build both library frameworks and all tests
        run: dotnet build Foundatio.Repositories.slnx --configuration Release -warnaserror
      - name: Prove reset regressions fail on pre-fix code
        run: |
          set +e
          dotnet test --project tests/Foundatio.Repositories.Elasticsearch.Tests/Foundatio.Repositories.Elasticsearch.Tests.csproj --configuration Release --no-build --filter-class Foundatio.Repositories.Elasticsearch.Tests.SearchAfterRequestTests --report-trx --results-directory /tmp/pr308-validation/baseline 2>&1 | tee /tmp/pr308-validation/baseline.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          python - <<'ENDPY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          results = [item for path in Path('/tmp/pr308-validation/baseline').rglob('*.trx') for item in ET.parse(path).iter() if item.tag.endswith('UnitTestResult')]
          failed = [item for item in results if item.get('outcome') == 'Failed']
          expected = ('WhenLiveSessionIsReset', 'WhenBeforeQueryResetsLiveSession', 'WhenAfterQueryResetsLiveSession')
          assert len(failed) == 16, [(item.get('testName'), item.get('outcome')) for item in results]
          assert all(any(name in item.get('testName', '') for name in expected) for item in failed)
          assert all('No exception was thrown' in ''.join(item.itertext()) for item in failed)
          assert all(item.get('outcome') in ('Passed', 'Failed') for item in results)
          print(f'Confirmed {len(failed)} expected regression failures and {len(results) - len(failed)} passing controls/existing tests.')
          ENDPY
      - name: Preserve source and diagnostics
        if: always()
        run: |
          mkdir -p /tmp/pr308-validation
          git bundle create /tmp/pr308-validation/source.bundle HEAD
          git log -2 --format=fuller > /tmp/pr308-validation/commits.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr-308-baseline
          path: /tmp/pr308-validation
          retention-days: 3
          if-no-files-found: error
